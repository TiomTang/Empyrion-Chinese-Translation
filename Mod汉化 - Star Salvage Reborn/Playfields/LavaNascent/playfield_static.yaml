### Resource Deposits
RandomResources:

      # EVENLY DISTRIBUTED resources
    - Name: SathiumResource
      IsScalingCount: True 
      Biome: [ LavaPlains, CrystallizedRocks, Cliffs ]
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 3, 5 ]
      DepthMinMax: [ 3, 15 ]
      MaxDroneCount: 2
      DroneProb: 1
      MaxDroneCount: 4 

    - Name: GoldResource
      Biome: [ LavaFolds, CrystallizedRocks ]
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DepthMinMax: [ 10, 25 ]
      DroneProb: 1
      MaxDroneCount: 3
      # DistTypeCylinder:
        # MaxRadius: 13
        # YVariance: 10

    - Name: ErestrumResource
      Biome: [ LavaPlains, CrystallizedRocks]
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 3, 5 ]  # About 540-3300 ores
      DepthMinMax: [ 3, 7 ]
      DroneProb: 1  
      MaxDroneCount: 4 


      # WEIGHTED resources
      # (= "Deposits close to POI are bigger, more valuable; planetary deposits less so")

      # => _Two_ entries for deposits of the same resource are defined
      # => Resource deposits that are defined first will be taken by POI, an then, if numbers not sufficient, the resources of the second entry.
      # => The remaining deposits will be spread over the planet
      # => Highest 'CountMinMax' of both entries is the total number of deposits, of that ore, on playfield
      
      # Weighted
    - Name: PromethiumResource     # Rich. Will get grabbed by POI.
      Biome: [ LavaFolds, Rifts_1, Hotspot, Rifts, CrystallizedRocks, Bubble, Cliffs, Canyon, Abyss ]
      CountMinMax: [ 0, 1 ]        # Defines number of high-value deposits.
      SizeMinMax: [ 3, 5 ]
      DepthMinMax: [ 0, 5 ]
      DroneProb: 1
      MaxDroneCount: 4 
      # DistTypeCylinder:
        # MaxRadius: 8
        # YVariance: 15
    - Name: PromethiumResource    # Normal, spread over planet
      IsScalingCount: True 
      Biome: [ LavaFolds, Rifts_1, Hotspot, Rifts, CrystallizedRocks, Bubble, Cliffs, Canyon, Abyss ]
      CountMinMax: [ 0, 1 ]       # Total number of Promethium resources on playfield (since this is the higher value of both entries, due to scaling)
      SizeMinMax: [ 2, 4 ]        # Size of the remaining Promethium resources on playfield
      DepthMinMax: [ 3, 15 ]
      DroneProb: 1
      MaxDroneCount: 3
      # DistTypeCylinder:
        # MaxRadius: 8
        # YVariance: 15

      # Weighted
    - Name: ZascosiumResource    # Rich. Will get grabbed by POI
      Biome: [ Hotspot, Rifts_1, CrystallizedRocks, Cliffs, Canyon, Abyss ]
      CountMinMax: [ 0, 1 ] 
      SizeMinMax: [ 3, 4 ]       # ca. 860-1200 ore
      DepthMinMax: [ 3, 7 ]
      DroneProb: 1.0
      MaxDroneCount: 4
    - Name: ZascosiumResource    # Normal
      Biome: [ Hotspot, Rifts_1, Cliffs, CrystallizedRocks, Canyon, Abyss ]
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 2, 2 ]
      DepthMinMax: [ 15, 30 ]
      DroneProb: 1
      MaxDroneCount: 5



