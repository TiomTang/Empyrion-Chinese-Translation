PlanetType: LavaNascent
Emissive: True
PlayfieldType: Planet
Difficulty: 4

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

LandClaimZone: Device


# == Atmosphere and Sky

SunFlare: EnvironmentalEffects/SunFlareYellow

AtmosphereEnabled: True
AtmosphereColor: "0.3, 0.65, 0.65"

# Basic colours
AtmosphereParams: [1, 1.6] 
SkyColor: "0.40, 0.5, 0.25"
SkyHorizonColor: "0.0, 0.50, 0.50"
FogColor: "0.4, 0.50, 0.4"

# Fog
FogCloudIntensity: 0.8
AtmosphereFog: 0
GroundFogIntensity: 0.01
