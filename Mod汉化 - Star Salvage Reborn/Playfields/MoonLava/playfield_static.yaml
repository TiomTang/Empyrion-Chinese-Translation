---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "\u4E00\u9897\u5E7C\u5E74\u536B\u661F\uFF0C\u62E5\u6709\u5C1A\u672A\u56FA\u5316\u7684\u6838\u5FC3\uFF0C\u4EE5\u53CA\u5FAE\u5F31\u7684\u5927\u6C14\u75D5\u8FF9\u3002\u5B83\u53EF\u80FD\u8BDE\u751F\u4E8E\u661F\u76D8\uFF0C\u6216\u662F\u4E00\u573A\u58EE\u89C2\u884C\u661F\u78B0\u649E\u7684\u6B8B\u9AB8\u3002"

PlanetType: MoonLava
Emissive: True
PlayfieldType: Moon
Difficulty: 3
# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

LandClaimZone: Device

# Atmosphere and Sky
AtmosphereEnabled: True

# Light
DayLightIntensity: 0.65
NightLightIntensity: 0.8
DayShadowStrength: 0.95

# Sun
SunFlare: EnvironmentalEffects/SunFlareRed

# Atmosphere and Sky
AtmosphereColor: "0.88, 0.48, 0.25"
SkyColor: "0.8, 0.1, 0" 
SkyHorizonColor: "0.2, 0.005, 0"
AtmosphereParams: [2, 1.6]     

# Light
LightZenithColor: "1, 0.95, 0.98"
LightHorizonColor: "1, 0.6, 0.15"
NightLightColor: "0.78, 0.78, 1"

DayShadowStrength: 1
NightShadowStrength: 1

# Fog
# AtmosphereFog: 0.00
FogCloudIntensity: 0.0
FogColor: "1, 0, 0"
# GroundFogIntensity: 0.03
# GroundFogHeight: 125

# Clouds and Wind
CloudsDensity: 0.0
CloudsSharpness: 1
CloudsBrightness: 0.0
CloudsOpacity: 0.0
 
CloudsZenithColor: "-0.1, -0.2, -0.2"
CloudsHorizonColor: "1, 0.3, 0.1"

WindSpeed: 0

# ==============================================================

### Resource Deposits
RandomResources:
    - Name: CobaltResource
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 2, 3 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1

    - Name: MagnesiumResource
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1 

    - Name: TitanResource
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DroneProb: 0.7
      MaxDroneCount: 1
      DepthMinMax: [ 0, 5 ]
      # DistTypeCylinder:
        # MaxRadius: 13
        # YVariance: 10
### Resource Asteroids
AsteroidResources:
     - Name: CobaltResource
       Threshold: 0.2
       Amount: 0.2
     - Name: MagnesiumResource
       Threshold: 0.2
       Amount: 0.2
     - Name: PromethiumResource
       Threshold: 0.2
       Amount: 0.2

### POIs
POIs:
