# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html
Description: "\u8FD9\u9897\u6E29\u5E26\u884C\u661F\u53EF\u80FD\u770B\u8D77\u6765\u5F88\u8BF1\u4EBA\uFF0C\u4F46\u4F60\u51DD\u89C6\u5B83\u65F6\u5374\u611F\u5230\u4E00\u79CD\u5947\u602A\u7684\u5C40\u4FC3\u4E0D\u5B89...\n\n\u8BE5\u661F\u7403\u4E0D\u5141\u8BB8\u964D\u843D\u4E3B\u529B\u8230\u3002"
PlanetType: Haunted
PlayfieldType: Planet
Difficulty: 3
PlayfieldLevel: 7                 

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

AllowCV: False  

LandClaimZone: Device

# Sun
SunFlare: EnvironmentalEffects/SunFlareBlue

# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.674, 0.824, 1.000"

SkyColor: "1, 0.96, 0.96"
SkyHorizonColor: "1, 0.43, 0.1"

# Light
DayLightIntensity: 1.375
NightLightIntensity: 0.05

LightZenithColor: "1,0.95,0.97"
LightHorizonColor: "0.91, 0.53, 0"
NightLightColor: "0.07, 0.07, 0.3"

DayShadowStrength: 1
NightShadowStrength: 1

# Fog
# AtmosphereFog: 0.35
