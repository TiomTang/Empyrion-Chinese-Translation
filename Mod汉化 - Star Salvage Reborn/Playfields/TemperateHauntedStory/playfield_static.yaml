### POIs
POIs:
    Random:
       # ================================
       #        FUKUSHIMA COLONY  
       # ================================
        - GroupName: SSFukushimaColony
          Faction: GhostShip  
          Biome: [ Grassland ]
          CountMinMax: [ 1, 1 ]
          IsImportant: True
          #AuxiliaryPOIs: [SSFukushimaFarm1, SSFukushimaFarm2, SSFukushimaFarm3]
          Properties:
            - Key: Music
              Value: EvilWhispering
            - Key: SI
              Value: Off
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720

        - GroupName: SSFukushimaEscape 
          Type: SV_Player
          Faction: None
          CountMinMax: [ 1, 1 ]
          IsImportant: True
          SpawnPOINear: [SSFukushimaColony]
          SpawnPOINearRange: [100, 250] 
          Properties: 
            - Key: MapMarker 
              Value: Neutral 
              
        - GroupName: SSFukushimaFarm1
          Faction: GhostShip  
          #IsAuxPOI: True
          BiomesExcluded: [ PolarSnow, GlacierSnow, Mountains, LowMountains, WaterSwamp, Tundra, Swamp, Marsh, DustBowl ]
          CountMinMax: [ 1, 1 ]
          IsImportant: True
          SpawnPOINear: [SSFukushimaColony]
          SpawnPOINearRange: [300, 500] 
          Properties: 
            - Key: Music
              Value: EvilWhispering
            - Key: SI
              Value: Off
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720
              
        - GroupName: SSFukushimaFarm2
          Faction: GhostShip  
          #IsAuxPOI: True
          BiomesExcluded: [ PolarSnow, GlacierSnow, Mountains, LowMountains, WaterSwamp, Tundra, Swamp, Marsh, DustBowl ]
          CountMinMax: [ 1, 1 ]
          IsImportant: True
          SpawnPOINear: [SSFukushimaColony]
          SpawnPOINearRange: [300, 500] 
          Properties: 
            - Key: Music
              Value: EvilWhispering
            - Key: SI
              Value: Off
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720              
              
        - GroupName: SSFukushimaFarm3
          Faction: GhostShip  
          #IsAuxPOI: True
          BiomesExcluded: [ PolarSnow, GlacierSnow, Mountains, LowMountains, WaterSwamp, Tundra, Swamp, Marsh, DustBowl ]
          CountMinMax: [ 1, 1 ]
          IsImportant: True
          SpawnPOINear: [SSFukushimaColony]
          SpawnPOINearRange: [300, 500] 
          Properties: 
            - Key: Music
              Value: EvilWhispering
            - Key: SI
              Value: Off
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720       
       # ================================
        # POI amount scales with planet size 
        # Random tribal villages scattered around planet
              
        - GroupName: TribalVillageAbandoned
          Faction: None  
          Biome: [ Forest, DeepForest ]
          CountMinMax: [ 1, 2 ]
          IsScalingCount: True
          AuxiliaryPOIs: [TribalField, Ruins, TribalDefence]
          Properties: 
            - Key: RegenAfter
              Value: 720

        - GroupName: TribalField
          Faction: None
          Territory: False         
          IsAuxPOI: True
          BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          CountMinMax: [ 5, 6 ]
          # SpawnPOINear: [TribalBazar]
          SpawnPOINearRange: [30, 120]
          Properties: 
            - Key: RegenAfter
              Value: 720  

        - GroupName: Ruins
          Faction: None  
          BiomesExcluded: [ Radiated ]
          CountMinMax: [ 2, 3 ]
          SpawnPOINearRange: [80, 250] 
          Properties:  
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720
 
        - GroupName: TribalDefence
          Faction: GhostShip  
          IsAuxPOI: True
          BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          CountMinMax: [ 4, 5 ]
          # SpawnPOINear: [TribalBazar]
          SpawnPOINearRange: [300, 400] 
          Properties: 
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720


        # Different POIs scattered around planet
        - GroupName: CrashedShip    
          Faction: GhostShip     
          CountMinMax: [ 2, 3 ]
          IsScalingCount: True 
          PlaceAt: UnderWater, Terrain
          Properties:
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

        - GroupName: ReclaimedPOI
          Faction: Salvage  
          CountMinMax: [ 1, 2 ]
          IsScalingCount: True
          Properties: 
            - Key: Music
              Value: lava
            - Key: RegenAfter
              Value: 720

        - GroupName: Wreckage
          Faction: None  
          CountMinMax: [ 1, 3 ]
          IsScalingCount: True 
          Properties:  
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720

        - GroupName: Ruins
          Faction: None  
          Biome: [ WaterSwamp, Swamp, Forest ]
          CountMinMax: [ 2, 3 ]
          IsScalingCount: True
          Properties:  
            - Key: MapMarker 
              Value: Neutral 
            - Key: RegenAfter
              Value: 720




SpawnRateZones:
      
SpawnZones:
   - SpawnAt: [CrashedShip, Ruins, Wreckage, ReclaimedPOI]
     BiomesExcluded: [ LowMountains, Mountains ]
     Radius: 500
     RadiusRandom: 50
     RateMultiplyerCenter: 1.0
     RateMultiplyerEdge: 0.5
     Color: "1.0, 1.0, 1.0, 1.0"
     SpawnOnlyIfPoiIsAlien: true
     Entities:
       - Names: [AlienBugs03, Spiders01]
         Biomes: [Any]
         Amount: 200
         Period: Always
         DelayMinMax: [-1, -1]
   - SpawnAt: [TribalVillage]
     BiomesExcluded: [ LowMountains, Mountains ]
     Radius: 500
     RadiusRandom: 50
     RateMultiplyerCenter: 1.0
     RateMultiplyerEdge: 0.8
     Color: "1.0, 1.0, 1.0, 1.0"
     SpawnOnlyIfPoiIsAlien: true
     Entities:
       - Names: [TalonGuardianHerd]
         Biomes: [Any]
         Amount: 300
         Period: Always
         DelayMinMax: [200, 240]
   - SpawnAt: [ReclaimedPOI]
     BiomesExcluded: [ LowMountains, Mountains ]
     Radius: 500
     RadiusRandom: 25
     RateMultiplyerCenter: 1.0
     RateMultiplyerEdge: 0.6
     Color: "1.0, 1.0, 1.0, 1.0"
     SpawnOnlyIfPoiIsAlien: true
     Entities:
       - Names: [ZiraxMinigunPatrol, ZiraxRocketPatrol, ZiraxShotgunPatrol, ZiraxMechanoidPatrol, ZiraxRipperDogPatrol]
         Biomes: [Any]
         Amount: 200
         Period: Always
         DelayMinMax: [-1, -1]
    


