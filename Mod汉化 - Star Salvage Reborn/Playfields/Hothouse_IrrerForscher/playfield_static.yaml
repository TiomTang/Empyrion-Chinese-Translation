PlanetClass: Hot Junkyard
PlanetType: Chaos Junkyard
PlayfieldType: Planet
Difficulty: 6

AllowBlueprintSV: True
AllowBlueprintCV: False
AllowBlueprintBA: False # Specialised conditions must build from scratch or take over excising
AllowBlueprintHV: True
LandClaimZone: Device

# Atmosphere and Sky
AtmosphereEnabled: True   
AtmosphereColor: "2.3, 1.5, 1.10"  # was "1.0, 0.86, 0.88" now is classic Hot House  initailly
SkyColor: "0.7, 0.4, 0.1" # was "1, 0.6, 0.6" #  
SkyHorizonColor: "0.2, 0.23, 0.005" # was "1, 0.2, 0.2" now is classic Hot House  initailly
AtmosphereParams: [10, -5]

# Light
DayLightIntensity: 1.5 # was 1.3
NightLightIntensity: 0.8 # Was .48

DayShadowStrength: 0.95
NightShadowStrength: 0.5

LightZenithColor: "0.7, 0.5, 0.2" # was "1, 0.75, 0.60"
LightHorizonColor: "1, 0.5, 0" # was "1, 0.3, 0.2"
NightLightColor: "0.5, 0.3, 0.0" # was "0.7, 0.7, 1"


# Sun
SunFlare: EnvironmentalEffects/SunFlareBlue

# Fog
FogCloudIntensity: 0.9
AtmosphereFog: 0.6
GroundFogIntensity: 0.08
GroundFogHeight: 1030

# Clouds and Wind
CloudsDensity: 0.7 # was 0.4
CloudsSharpness: 0.2 # was 0.3
CloudsBrightness: 0.7 # was 1.0
CloudsOpacity: 0.9 # was 1.0
CloudsZenithColor: "0.5, 0.3, 0.4"
CloudsHorizonColor: "1, 0.18, 0.18"
WindSpeed: 6 # was 4


# Special effects around the players
SpecialEffectsLocal:
  - Name: Grime
    MaxHeight: 20
  - Name: Grime
    MaxHeight: 30
  - Name: Grime
    MaxHeight: 40
  - Name: DustDevil
    Biome: [ Desert, Dunes, Rocks ]  
    Time: Day
    FollowPlayerY: True
    MaxHeight: 10
  - Name: FireFliesGreenFew
    Biome: [ Marsh, Oasis, OasisEdge, OasisThin, Grassland ]
    Time: Night
    MaxHeight: 15
  - Name: WindLines
    Biome: [ Desert, Dunes, Rocks, LowMountains, Mountains ]
    Time: Day
    MaxHeight: 10

SpecialEffectsGlobal:
# Weather
  - Name: CloudsDark
