---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

PlanetType: Lava
Emissive: True
PlayfieldType: Planet
Difficulty: 4

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

LandClaimZone: Device

Description: "\u884C\u661F\u7531\u65CB\u8F6C\u3001\u6563\u843D\u7684\u7070\u70EC\u2014\u2014\u5DF2\u6B7B\u4EA1\u3001\u7206\u70B8\u7684\u6052\u661F\u7684\u9057\u7559\u8005\u2014\u2014\u8BDE\u751F\u3002\n\n...\u91CD\u529B\u5C06\u6536\u96C6\u6240\u6709\u8FD9\u4E9B\u51CC\u4E71\u7684\u788E\u7247\uFF0C\u5E76\u8D4B\u4E88\u5B83\u65B0\u7684\u5F62\u6001\u3002\n\n\n\n\u4F46\u4E00\u4E2A\u4E16\u754C\u7684\u5CA9\u77F3\u548C\u5C18\u57C3\uFF0C\u7F13\u6162\u5730\u7814\u78E8\u3001\u805A\u96C6\u5728\u4E00\u8D77\u2026\u2026\u5C06\u4EA7\u751F\u5DE8\u5927\u7684\u6469\u64E6\u529B\u3002\n\n\n\n\u8FD9\u610F\u5473\u7740\uFF0C[b][i]\u70ED\u91CF[/i][/b]\u3002\n\n\n\n\u8FD9\u4E2A\u5730\u65B9\u4EC5\u4EC5\u5B58\u5728\u4E86\u4E8C\u70B9\u4E94\u4EBF\u5E74\uFF0C\u6B63\u5728\u52AA\u529B\u5C06\u6240\u6709\u8FD9\u4E9B\u591A\u4F59\u7684\u70ED\u91CF\u8F90\u5C04\u5230\u592A\u7A7A\u4E2D\u2014\u2014\n\u661F\u7403\u8D8A\u5927\uFF0C\u6240\u9700\u65F6\u95F4\u5C31\u8D8A\u957F\u3002\n\n\n\n\u5728\u8FD9\u79CD\u6DB2\u6001\u72B6\u6001\u4E0B\uFF0C\u8FD9\u9897\u661F\u7403\u66F4\u50CF\u662F\u4E00\u4E2A\u5DE8\u5927\u7684\u70F9\u996A\u9505\uFF0C\u6216\u7194\u5CA9\u706F\uFF0C\u6216\u9AD8\u7089\uFF1A\n\u7531\u5BC6\u5EA6\u8F83\u4F4E\u7684\u77FF\u6E23\u7EC4\u6210\u7684\u5927\u9646\u8986\u76D6\u5728\u8868\u9762\uFF0C\u800C\u91CD\u8D28\u3001\u5947\u5F02\u7684\u91D1\u5C5E\u5219\u6C89\u5165\u661F\u7403\u6DF1\u5904\u3002\n\n\n\n\u7136\u800C\uFF0C\u901A\u8FC7\u70ED\u529B\u7684\u7FFB\u6EDA\u548C\u6405\u62CC\uFF0C\u4E00\u4E9B\u73CD\u8D35\u7684\u6838\u5FC3\u7269\u8D28\u5C06\u518D\u6B21\u88AB\u5E26\u56DE\u8868\u9762\uFF0C\u89E6\u624B\u53EF\u53CA\u3002\n\n\n\n\u5BF9\u4E8E\u90A3\u4E9B\u80FD\u591F\u5FCD\u53D7\u8FD9\u4E9B\u6E29\u5EA6\u7684\u4EBA\u6765\u8BF4\uFF0C\u5C06\u4F1A\u6709\u4E30\u539A\u7684\u56DE\u62A5\u3002"



# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.80, 0.44, 0.17" 
SkyColor: "0.0, 0.0, 0.2"
SkyHorizonColor: "0.35, 0.15, 0"
AtmosphereParams: [3, 1.7]     

# Light
DayLightIntensity: 0.6
NightLightIntensity: 0.7
LightZenithColor: "1, 0.95, 0.95"
LightHorizonColor: "1, 0.5, 0"
NightLightColor: "1, 0.55, 0.3"

DayShadowStrength: 0.95
NightShadowStrength: 0.5

# Sun
SunFlare: EnvironmentalEffects/SunFlareYellow2

# Fog
FogColor: "1.2, 0.4, 0.0"
FogCloudIntensity: 0.8
# AtmosphereFog: 0.95
# GroundFogIntensity: 0.02
# GroundFogHeight: 35

# Clouds and Wind
CloudsDensity: 1
CloudsSharpness: 0.2
CloudsBrightness: 0.3
CloudsOpacity: 0.7
CloudsZenithColor: "0.6, -0.1, -0.4"
CloudsHorizonColor: "2, 0.1, 0.45"
CloudsNightHorizonColor: "0.8, 0.15, 0.00"
CloudsNightZenithColor: "0.8, 0.15, 0.00"
WindSpeed: 30


# Special effects around the player
SpecialEffectsLocal:
  - Name: Grime
    MaxHeight: 20

SpecialEffectsGlobal:
# Weather

 # Do not use the weathers CloudsLight, CloudsMedium, Wind, ColdWave here! (Their clouds react extremely to colouring)
 # weather Clear >>  Already in HeatWave


  - Name: Clouds
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1500
  - Name: CloudsDark
    Type: Weather
    InitialDelay: 0
    Delay: 2  
    Lifetime: 1200
  - Name: Fog
    Type: Weather
    InitialDelay: 48
    Delay: 12
    Lifetime: 1000
  - Name: HeatWave
    Type: Weather
    InitialDelay: 12
    Delay: 12
    Lifetime: 1200
  - Name: MeteorFireRain
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 300
  - Name: FireRain
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 300

# Global Effect
  - Name: MeteorShower
    Time: Day
    InitialDelay: 1
    Delay: 5
    Lifetime: 60
    PlyDist: 200
    SpawnY: 100
    Struct: Avoid

  - Name: ThunderAndLightningPurple
    Time: Night
    InitialDelay: 1.5   
    Delay: 4
    Lifetime: 300     
    PlyDist: 100
    SpawnY: 500
    Struct: Avoid    
