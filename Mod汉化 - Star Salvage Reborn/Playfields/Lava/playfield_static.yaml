### Resource Deposits
RandomResources:
    - Name: MagnesiumResource
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 3, 8 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 1
      MaxDroneCount: 4 

    - Name: ErestrumResource
      Biome: [ Flats, CrystallizedRocks ]
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 4, 5 ]
      DepthMinMax: [ 5, 20 ]
      DroneProb: 1  
      MaxDroneCount: 4 

    - Name: ZascosiumResource
      Biome: [ Plains, Dunes, Rocks ]
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 2, 3 ]
      DepthMinMax: [ 5, 20 ]
      DroneProb: 1
      MaxDroneCount: 4

    - Name: GoldResource
      Biome: [ LavaEdge, LavaFolds, Plains ]
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 3, 5 ]
      DroneProb: 1
      MaxDroneCount: 3
      DepthMinMax: [ 6, 15 ]
      # DistTypeCylinder:
        # MaxRadius: 13
        # YVariance: 10

### Resource Asteroids
AsteroidResources:
     - Name: MagnesiumResource
       Threshold: 0.2
       Amount: 0.3

