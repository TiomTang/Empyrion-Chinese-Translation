### Resource Deposits
RandomResources:
    - Name: TitanResource  # First entry will get grabbed by POI
      BiomesExcluded: [ IceSheet, PolarSnow ]
      CountMinMax: [ 0, 2 ] 
      SizeMinMax: [ 3, 3 ] 
      DepthMinMax: [ 15, 20 ] 
      DroneProb: 0.7 
      MaxDroneCount: 2
        
    - Name: TitanResource # Second entry will be ignored by POI. Less value.
      Biome: [ PalmForest, HighPalms, DeepForest, LowMountains, Savanna, DustBowl ]
      CountMinMax: [ 0, 1 ] 
      IsScalingCount: True
      SizeMinMax: [ 1, 2 ] 
      DepthMinMax: [ 15, 20 ] 
      DroneProb: 0.7 
      MaxDroneCount: 2

    - Name: ErestrumResource  # 'Nice find'
      BiomesExcluded: [ IceSheet ]
      CountMinMax: [ 0, 1 ] 
      SizeMinMax: [ 1, 1 ] 
      DepthMinMax: [ 5, 10 ] 
      DroneProb: 0.2 
      MaxDroneCount: 1

    - Name: GoldResource  # 'Nice find'
      BiomesExcluded: [ IceSheet ]
      CountMinMax: [ 0, 1 ] 
      SizeMinMax: [ 1, 1 ] 
      DepthMinMax: [ 8, 12 ] 
      DroneProb: 0.2 
      MaxDroneCount: 1
      # DistTypeCylinder:
        # MaxRadius: 13
        # YVariance: 10


### Resource Asteroids
