SpecialEffectsGlobal:
# Weather
    # Standard
  - Name: Clear
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1200
  - Name: CloudsLight
    Type: Weather
    InitialDelay: 2
    Delay: 2
    Lifetime: 1000
  - Name: Wind
    Type: Weather
    InitialDelay: 15
    Delay: 15
    Lifetime: 300

    # Bad weather
  - Name: Storm
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 400

    # Special
  - Name: HeatWave
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 600


# Global Effect
  - Name: BirdFlocksCrows
    Biome: [ Any ]
    Time: Day
    InitialDelay: 1 
    Delay: 4 
    Lifetime: 600 
    PlyDist: 100
    SpawnY: 30
    Struct: True

