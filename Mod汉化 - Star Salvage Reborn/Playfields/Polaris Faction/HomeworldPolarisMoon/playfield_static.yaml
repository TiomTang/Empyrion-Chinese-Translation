Description: "\u8FD9\u5757\u8352\u829C\u7684\u5CA9\u77F3\u5C06\u5B83\u7684\u5386\u53F2\u523B\u5728\u8868\u9762\uFF1A\n\n\u5B8C\u5168\u51DD\u56FA\uFF0C\u6CA1\u6709\u5927\u6C14\u5C42\u6765\u62B9\u53BB\u75D5\u8FF9\u548C\u5F62\u72B6\u2014\u2014\n\n\u6BCF\u4E00\u6B21\u76F8\u9047\u90FD\u5C06\u88AB\u94ED\u8BB0\u3002"




PlanetType: PolarisHomeworldMoon
PlayfieldType: Moon
Difficulty: 2

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False


LandClaimZone: Device


# Atmosphere and Sky
AtmosphereEnabled: False

# Light
DayLightIntensity: 1.6
NightLightIntensity: 0.7

DayShadowStrength: 0.95

# Sun
SunFlare: EnvironmentalEffects/SunFlareWhiteMoon

# ==============================================================

### Resource Deposits
RandomResources:

### Resource Asteroids
AsteroidResources:

### POIs
POIs:
    Random:  
        - GroupName: DroneBaseT1              #CommandCenter
          DroneSetupID: DroneBasePolaris
          Faction: Polaris    
          NoShieldReload: True
          BiomesExcluded: [Radiated,RadiatedFog]
        #  IsCommandCenter: True
          CountMinMax: [ 1, 1 ]
          DroneProb: 1.0
          DronesMinMax: [ 3, 5 ]
          ReserveCount: 5
          Properties: 
            - Key: Music
              Value: moonstone
            - Key: RegenAfter
              Value: 720 

        - GroupName: PolarisIndustrialSingle                      # Main Building
          Faction: Polaris  
          NoShieldReload: True
       #   BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          IsImportant: True
          CountMinMax: [ 1, 2 ]
          SpawnResource: ["SiliconResource:1-2","PromethiumResource:2-2"]
          SpawnResourceRange: [150,300]
          Properties:  
            - Key: RegenAfter
              Value: 720

        - GroupName: PolarisIndustrialMain                      # Main Building
          Faction: Polaris  
          NoShieldReload: True
       #   BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          IsImportant: True
          CountMinMax: [ 2, 4 ]
          SpawnResource: ["SiliconResource:1-2","PromethiumResource:2-2"]
          SpawnResourceRange: [150,300]
          Properties:  
            - Key: RegenAfter
              Value: 720

        - GroupName: PolarisIndustrialAux
          Faction: Polaris  
          NoShieldReload: True
      #    Biome: [ LowMountains, LowMountains_1, Mountains ]
          CountMinMax: [ 3, 6 ]
          SpawnPOINear: [PolarisIndustrialMain]
          SpawnPOINearRange: [100, 1000] 
          Properties: 
            - Key: RegenAfter
              Value: 720

        - GroupName: PolarisDefence
          Faction: Polaris         
          NoShieldReload: True
      #    Biome: [ LowMountains, LowMountains_1, Mountains ]
          CountMinMax: [ 2, 4 ]
          SpawnPOINear: [PolarisLogisticsMain]
          SpawnPOINearRange: [300, 400] 
          Properties: 
            - Key: RegenAfter
              Value: 720
              

    FixedPlayerStart:
        - Mode: Debug
          Pos: [ -596, 104, -1063 ]
          RotY: 125

        - Mode: Survival
          Spawn: EscapePod
          Armor: ArmorMedium

