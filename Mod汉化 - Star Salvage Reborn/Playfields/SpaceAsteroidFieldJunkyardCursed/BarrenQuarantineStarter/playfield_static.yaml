SpawnRateZones:
   - SpawnAt: [TSPQuarantineStarter]
     Radius: 1000
     RadiusRandom: 50
     RateMultiplyerCenter: 0.0
     RateMultiplyerEdge: 0.7
     AffectEnemies: true
     Color: "0.0, 1.0, 0.0, 0.7"  

SpawnZones:
   - SpawnAt: [CrashedShip, AbandonedPOI, Artifacts]
     BiomesExcluded: [ LowMountains, Mountains ]
     Radius: 500
     RadiusRandom: 50
     RateMultiplyerCenter: 1.0
     RateMultiplyerEdge: 0.5
     Color: "1.0, 1.0, 1.0, 1.0" 
     SpawnOnlyIfPoiIsAlien: true
     Entities:
       - Names: [CaveWormGreyHerd, Otyughs, Spiders02]
         Biomes: [Any]
         Amount: 200
         Period: Always
         DelayMinMax: [-1, -1]
   - SpawnAt: [Wreckage, CrashedShip, Junksite, JunkT2, JunkT1, Ruins]
   #  BiomesExcluded: [ LowMountains, LowMountains_1, Mountains ]
     Radius: 175
     RadiusRandom: 50
     RateMultiplyerCenter: 1.0
     RateMultiplyerEdge: 1.0
     Color: "1.0, 1.0, 1.0, 1.0"
  #   SpawnOnlyIfPoiIsAlien: true
     Entities:
       - Names: [ScraperDronesBlue, ScraperDronesArmy]
         Biomes: [Any]
         Amount: 25
         Period: Always
         DelayMinMax: [-1, -1]
       - Names: [ScraperDronesBlue, ScraperDronesArmy]
         Biomes: [Any]
         Amount: 25
         Period: Always
         DelayMinMax: [-1, -1]
       - Names: [ScraperDronesBlue, ScraperDronesArmy]
         Biomes: [Any]
         Amount: 25
         Period: Always
         DelayMinMax: [-1, -1]
