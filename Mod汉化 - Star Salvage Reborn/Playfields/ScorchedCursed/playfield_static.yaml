          CountMinMax: [ 1, 1 ]
          DroneProb: 1
          DronesMinMax: [ 1, 2 ]
          ReserveCount: 0
          TroopTransport: True
          SpawnPOINear: [CrashedTalosBack]
          SpawnPOINearRange: [800, 2000]
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720


