          SpawnPOINearRange: [1500, 2000]   # Will _only_ spawn if DroneBaseT1 is there, too.
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

        - GroupName: CrashedTalosMid
