        - GroupName: Junksite    # Not scaling 
          Faction: None
          BiomesExcluded: [ ColdPlains ]
          CountMinMax: [ 0, 1 ]
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720



         # == Ship Wreckages =======================================

        - GroupName: CrashedShip
          Faction: None
