        - GroupName: JunkT3_Engine
          Biome: [ Rifts]
          IsImportant: True
          Faction: None
          CountMinMax: [ 0, 1 ]
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: MapDistance
              Value: 500
            - Key: HudDistance
              Value: 500
