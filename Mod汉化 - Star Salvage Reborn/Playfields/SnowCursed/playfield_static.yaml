---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html
Description: "\u6CE8\u610F\uFF1A\u6B64\u661F\u7403\u4E0A\u4E0D\u5141\u8BB8\u505C\u9760\u4E3B\u529B\u8230\u3002"
PlanetType: Snow
PlayfieldType: Planet
Difficulty: 3

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

AllowCV: False

LandClaimZone: Device


Description: "Water is the great equalizer.
  \n
  \nIs it too hot? Then it will soak up the energy, to keep it for later. - Still liquid!
  \nOr too cold? - The water will move and spread the warmth around.
  \n
  \nAnd its ice will swim, and insulate the ocean below from freezing solid.
  \nBy this, even a world of all-encompassing snow might change, evolve and thrive.
  \n
  \nDare to exist near to a fickle, unpredictable star? 
  \nOr far away, at the outer edges of its generosity?
  \n... Between hot and cold, with [i]water[/i] there is always a place for life!"





# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.1, 0, 0" 
SkyColor: "0,0,0"
AtmosphereParams: [10, 3]

# Light
DayLightIntensity: 0.05
NightLightIntensity: 0.05
DayShadowStrength: 0.95

LightZenithColor: "0.01,0.01,0.01"
LightHorizonColor: "0.05,0,0"
NightLightColor: "0.1, 0, 0"

# Sun
SunFlare: EnvironmentalEffects/SunFlareRed
OrbitUsesLightColor: True

# Fog
FogColor: "0, 0, 0"
FogCloudIntensity: 0.8
# AtmosphereFog: 0.95
# GroundFogIntensity: 0.4
# GroundFogHeight: 800

# Clouds and Wind
CloudsDensity: 1
CloudsSharpness: 0
CloudsBrightness: 0
CloudsOpacity: 0.5
CloudsZenithColor: "0.03,0,0"
CloudsHorizonColor: "0.03,0.03,0"
CloudsNightZenithColor: "0, 0, 0.03"
CloudsNightHorizonColor: "0.02, 0.01, 0.02"

WindSpeed: 3

# Special Effects
SpecialEffectsLocal:
  - Name: FireFliesOrange
    Biome: [ Taiga, TaigaEdge, TaigaSnow]
    Time: Night
    MaxHeight: 15

SpecialEffectsGlobal:
  - Name: Clear
    Type: Weather
    InitialDelay: 0
    Delay: 3
    Lifetime: 1200
  - Name: CloudsLight
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1200
  # - Name: CloudsMedium  # Too bright here
    # Type: Weather
    # InitialDelay: 0
    # Delay: 3
    # Lifetime: 1200
  - Name: Clouds
    Type: Weather
    InitialDelay: 5
    Delay: 3
    Lifetime: 1200
  - Name: Fog
    Type: Weather
    InitialDelay: 12
    Delay: 5
    Lifetime: 1000
  - Name: SnowLight
    Type: Weather
    InitialDelay: 24
    Delay: 5
    Lifetime: 600
  - Name: SnowMedium
    Type: Weather
    InitialDelay: 24
    Delay: 12
    Lifetime: 600
  - Name: SnowHeavy
    Type: Weather
    InitialDelay: 24
    Delay: 12
    Lifetime: 600
  - Name: ColdWave
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 1000
  - Name: Hail
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 600

