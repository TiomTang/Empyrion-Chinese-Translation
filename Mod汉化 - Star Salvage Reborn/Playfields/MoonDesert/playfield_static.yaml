---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "\u8FD9\u9897\u536B\u661F\u7684\u5927\u6C14\u5C42\u975E\u5E38\u7A00\u8584\u2014\u2014\u5B83\u53D7\u5230\u9644\u8FD1\u661F\u7403\u5F02\u5E38\u5F3A\u5927\u7684\u78C1\u573A\u7684\u62A4\u76FE\u4FDD\u62A4\uFF0C\u800C\u4E14\u536B\u661F\u5BC6\u5EA6\u8DB3\u591F\u5927\uFF0C\u80FD\u591F\u4FDD\u7559\u4E00\u4E9B\u6C14\u4F53\uFF0C\u4F7F\u5176\u4E0D\u81F3\u4E8E\u6F02\u6563\u5230\u592A\u7A7A\u4E2D\u3002\u56E0\u6B64\uFF0C\u5B83\u79EF\u7D2F\u4E86\u5927\u91CF\u7684\u6C99\u6F20\u6F06\u3002"

PlanetType: MoonDesert
PlayfieldType: Moon
Difficulty: 3

LandClaimZone: Device

# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.30, 0.35, 0.35"
SkyColor: "0.05, 0.10, 0.00" 
SkyHorizonColor: "0.4, 0.1, 0"
AtmosphereParams: [5, 1.6]     

# Light
DayLightIntensity: 1.6
NightLightIntensity: 0.7
DayShadowStrength: 0.95

DayShadowStrength: 1
NightShadowStrength: 1

LightZenithColor: "1, 0.92, 0.84"
LightHorizonColor: "0.5, 0.4, 0.45"
NightLightColor: "0.78, 0.78, 1"

# Sun
SunFlare: EnvironmentalEffects/SunFlareWhiteMoon

# Fog
# AtmosphereFog: 0.00
FogColor: "0.9, 0.9, 0.1"
FogCloudIntensity: 0.0
# GroundFogIntensity: 0.05
# GroundFogHeight: 125

# Clouds and Wind
CloudsDensity: 0.0
CloudsSharpness: 1
CloudsBrightness: 0.0
CloudsOpacity: 0.0
 
CloudsZenithColor: "0.0, -0.1, -0.1"
CloudsHorizonColor: "1, 0.3, 0.1"

WindSpeed: 0


SpecialEffectsGlobal:
  - Name: Clear    # To remove the 'space view clouds'
    Type: Weather
    InitialDelay: 0
    Delay: 0
    Lifetime: 3000

# ==============================================================

### Resource Deposits
RandomResources:

    - Name: CobaltResource
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 2, 3 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1
      
    - Name: MagnesiumResource
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1 

### Resource Asteroids
AsteroidResources:
     - Name: CobaltResource
       Threshold: 0.2
       Amount: 0.2
     - Name: PentaxidResource
       Threshold: 0.2
       Amount: 0.2

### POIs
POIs:
    Random:
        - GroupName: DroneBaseT1     #CommandCenter
          Faction: Zirax  
          NoShieldReload: True
          IsCommandCenter: True
          DroneBaseSetup: DroneBaseSetup
          CountMinMax: [ 1, 1 ]
          DroneProb: 1.0
          DronesMinMax: [ 4, 5 ] 
          ReserveCount: 5
          Properties: 
            - Key: RegenAfter
              Value: 720

