        - GroupName: TribalZiggurat      # POI ANCHOR         # CommandCenter
          Faction: Predator  
          Biome: [ Oasis ]
          IsImportant: True
          IsCommandCenter: True
          CountMinMax: [ 1, 1 ]
          LevelMod: +3
          SpawnPOIAvoid: [START]
          SpawnPOIAvoidDistance: 4000
          SpawnPOINear: [START]
