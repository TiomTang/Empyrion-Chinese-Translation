---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "\u8FD9\u9897\u8352\u829C\u7684\u5CA9\u77F3\u661F\u7403\u5C06\u5B83\u7684\u5386\u53F2\u94ED\u523B\u5728\u8868\u9762\uFF1A\n\n\u5B8C\u5168\u51DD\u56FA\uFF0C\u6CA1\u6709\u5927\u6C14\u5C42\u6765\u62B9\u53BB\u75D5\u8FF9\u548C\u5F62\u72B6\u2014\u2014\n\n\u6240\u6709\u7684\u906D\u9047\u90FD\u5C06\u88AB\u94ED\u8BB0\u3002"



PlanetClass: Barren
PlanetType: MoonStarter               
PlayfieldType: Moon               
Difficulty: 1        

LandClaimZone: Device            

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
AllowBlueprintBA: False
AllowBlueprintHV: True #Pass 3


# Atmosphere and Sky
AtmosphereEnabled: False

# Light
DayLightIntensity: 1.6
NightLightIntensity: 0.7

DayShadowStrength: 0.95

# Sun                              
SunFlare: EnvironmentalEffects/SunFlareWhiteMoon

### Resource Deposits
RandomResources:
    - Name: MagnesiumResource
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1

    - Name: TitanResource
      IsScalingCount: True 
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DroneProb: 0.7
      MaxDroneCount: 1
      DepthMinMax: [ 2, 5 ]
      # DistTypeCylinder:
        # MaxRadius: 13
        # YVariance: 10
      
    - Name: PentaxidResource  # Defended by GhystAuxT1
      IsScalingCount: True 
      CountMinMax: [ 1, 1 ]
      SizeMinMax: [ 2, 3 ]
      DroneProb: 1
      MaxDroneCount: 5
      DepthMinMax: [ 6, 10 ]
      DistTypeCylinder:
        MaxRadius: 13
        YVariance: 10
### Resource Asteroids
AsteroidResources:
     - Name: IronResource
       Threshold: 0.2
       Amount: 0.2
### POIs
POIs:
    Random:  
        - GroupName: DroneBaseT1          #CommandCenter
          Faction: Zirax  
          NoShieldReload: True
          IsCommandCenter: True
          DroneBaseSetup: DroneBaseSetup
          CountMinMax: [ 0, 1 ]
          DroneProb: 1.0
          DronesMinMax: [ 4, 5 ] 
          ReserveCount: 5
          Properties: 
            - Key: RegenAfter
              Value: 720

# ======================= POLARIS Mining Stations ======================= 

        - GroupName: PolarisMiningMain          # Main Building
          Faction: Polaris  
          NoShieldReload: True
          BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          IsImportant: True
          CountMinMax: [ 1, 1 ]
          LevelMod: +3
          SpawnPOIAvoid: [DroneBaseT1]
          SpawnPOIAvoidDistance: 1000
          SpawnResource: ["TitanResource:1-1"]
          SpawnResourceRange: [150,400]
          Properties:  
            - Key: RegenAfter
              Value: 720

        - GroupName: PolarisMiningAux
          Faction: Polaris 
          NoShieldReload: True 
          BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          CountMinMax: [ 2, 3 ]
          SpawnPOINear: [PolarisMiningMain]
          SpawnPOINearRange: [100, 200] 
          Properties: 
            - Key: RegenAfter
              Value: 720

        - GroupName: PolarisDefence
          Faction: Polaris  
          NoShieldReload: True
          # Territory: False        
          BiomesExcluded: [ PolarSnow, Radiated, RadiatedFog ] 
          CountMinMax: [ 5, 6 ]
          SpawnPOINear: [PolarisMiningMain]
          SpawnPOINearRange: [300, 400] 
          Properties: 
            # - Key: HudDistance
              # Value: 400    
            - Key: RegenAfter
              Value: 720

 # ===== Fillers

        - GroupName: CrashedShip 
          Faction: None         
          CountMinMax: [ 1, 3 ]
          IsScalingCount: True 
          DroneProb: 0.2
          DronesMinMax: [ 1, 1 ]
          ReserveCount: 4
          TroopTransport: False
          Properties: 
            - Key: MapMarker 
              Value: Neutral  
            - Key: RegenAfter
              Value: 720
# ===== Junkyards
        - GroupName: RadosJunkyardMain
          Faction: Rados
          Biome: [ LargeCrater ]
          IsScalingCount: True 
          CountMinMax: [ 1, 1 ]
          IsImportant: True
          Properties: 
            - Key: RegenAfter
              Value: 720 

        - GroupName: RadosJunkyardAux
          Faction: Rados
          Biome: [ LargeCrater ]
          IsScalingCount: True 
          CountMinMax: [ 3, 5 ]
          IsImportant: True
          Properties: 
            - Key: RegenAfter
              Value: 720 

        - GroupName: PolarisDefence
          Faction: Polaris  
          NoShieldReload: True
          Biome: [ LargeCrater ]
          IsScalingCount: True 
          CountMinMax: [ 3, 5 ]
          Properties:  
            - Key: RegenAfter
              Value: 720

        - GroupName: JunkT2
          Faction: None  
          Biome: [ SmallCrater ] 
          CountMinMax: [ 1, 3 ]
          DroneProb: 1
          DronesMinMax: [ 1, 1 ]
          ReserveCount: 4
          Properties:
            - Key: MapMarker
              Value: Neutral
              
        - GroupName: JunkT2
          Faction: None  
          Biome: [ LargeCrater ] 
          CountMinMax: [ 1, 3 ]
          Properties:
            - Key: MapMarker
              Value: Neutral
            
        - GroupName: JunkT1
          Faction: None
          Biome: [ LargeCrater, SmallCrater ]
          CountMinMax: [ 10, 25 ]
          Properties: 
            - Key: MapDistance
              Value: 0   
            - Key: RegenAfter
              Value: 720  

        - GroupName: SSCPUJunkT2
          Faction: None  
