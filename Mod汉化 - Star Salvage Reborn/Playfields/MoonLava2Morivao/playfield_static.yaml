---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "\u8FD9\u9897\u5E74\u8F7B\u7684\u536B\u661F\u5DF2\u7ECF\u56E0\u6052\u661F\u98CE\u7684\u6301\u7EED\u5439\u62C2\u800C\u5931\u53BB\u4E86\u5927\u6C14\u5C42\u3002\u5728\u4E0D\u53D7\u5E72\u6270\u7684\u60C5\u51B5\u4E0B\uFF0C\u6700\u540E\u4E00\u7247\u5F00\u9614\u7684\u7194\u5CA9\u6D77\u6D0B\u7ED3\u6676\u6210\u5947\u5F02\u7684\u5F62\u6001\u3002"

PlanetType: Lava
Emissive: True
PlayfieldType: Moon
Difficulty: 3
# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

LandClaimZone: Device

# Atmosphere and Sky
AtmosphereEnabled: False

# Light
DayLightIntensity: 0.6
NightLightIntensity: 0.7
DayShadowStrength: 0.95

# Sun
SunFlare: EnvironmentalEffects/SunFlareWhiteMoon

# ==============================================================

### Resource Deposits
RandomResources:
    - Name: CobaltResource
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 2, 3 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1

    - Name: MagnesiumResource
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DepthMinMax: [ 6, 15 ]
      DroneProb: 0.7
      MaxDroneCount: 1 

    - Name: TitanResource
      IsScalingCount: True
      CountMinMax: [ 0, 1 ]
      SizeMinMax: [ 1, 2 ]
      DroneProb: 0.7
      MaxDroneCount: 1
      DepthMinMax: [ 0, 5 ]
      # DistTypeCylinder:
        # MaxRadius: 13
        # YVariance: 10
### Resource Asteroids
AsteroidResources:
     - Name: CobaltResource
       Threshold: 0.2
       Amount: 0.2
     - Name: MagnesiumResource
       Threshold: 0.2
       Amount: 0.2
     - Name: PromethiumResource
       Threshold: 0.2
       Amount: 0.2

### POIs
