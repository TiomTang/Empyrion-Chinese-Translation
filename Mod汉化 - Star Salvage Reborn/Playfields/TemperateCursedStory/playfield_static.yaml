SpawnRateZones:
   - SpawnAt: [TS_Planet]
     Radius: 1000
     RadiusRandom: 50
     RateMultiplyerCenter: 0.0
     RateMultiplyerEdge: 0.7
     AffectEnemies: true
     Color: "0.0, 1.0, 0.0, 0.7"  
      
SpawnZones:
   - SpawnAt: [CrashedShip, CursedWreck, PromethiumResource, Ruins, Wreckage, ReclaimedPOI]
     BiomesExcluded: [ LowMountains, Mountains ]
     Radius: 500
     RadiusRandom: 50
     RateMultiplyerCenter: 1.0
     RateMultiplyerEdge: 0.5
     Color: "1.0, 1.0, 1.0, 1.0"
