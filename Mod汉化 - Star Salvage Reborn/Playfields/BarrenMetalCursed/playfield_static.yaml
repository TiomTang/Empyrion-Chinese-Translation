# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "[c][e0e020]\u6CE8\u610F\uFF1A[-][/c]   [c]\u68C0\u6D4B\u5230\u591A\u4E2A\u9632\u7A7A\u70AE\u5854\u3002[-][/c]\n[c][808080][i]\u52A1\u5FC5\u6781\u5EA6\u8C28\u614E\u3002[-][/i][-][/c] \n\n\u5728\u661F\u7403\u5F62\u6210\u8FC7\u7A0B\u4E2D\uFF0C\u5927\u90E8\u5206\u91CD\u5143\u7D20\u4F1A\u6C89\u5165\u6838\u5FC3\u3002\n\u4F46\u5982\u679C\u4E00\u6B21\u5B87\u5B99\u707E\u96BE\u5265\u79BB\u4E86\u661F\u7403\u7684\u5916\u5C42\uFF0C\u6216\u8005\u5F53\u65F6\u6709\u4E30\u5BCC\u7684\u7269\u8D28\uFF0C\u90A3\u4E48\u5C31\u53EF\u80FD\u5B58\u5728\u6240\u8C13\u7684\u201C\u91D1\u5C5E\u661F\u7403\u201D\u3002\n\n\u65E0\u8BBA\u5982\u4F55\uFF0C\u90FD\u4F1A\u7559\u4E0B\u4E00\u5C42\u201C\u8584\u7684\u201D\u7845\u9178\u76D0\u5730\u5E54\uFF0C\u539A\u5EA6\u201C\u4EC5\u6709\u6570\u767E\u201D\u516C\u91CC\u3002\n\u5C3D\u7BA1\u5982\u6B64\uFF0C\u4ECD\u6709\u5927\u91CF\u53EF\u5F00\u91C7\u7684\u77FF\u85CF\uFF0C\u800C\u4E14\u91CD\u5143\u7D20\u548C\u5947\u5F02\u5143\u7D20\u7684\u77FF\u85CF\u4E5F\u6613\u4E8E\u83B7\u53D6\u3002\n\n\u7531\u4E8E\u8FD9\u662F\u4E00\u4E2A\u7A00\u6709\u4E4B\u5730\uFF0C\u5B83\u5438\u5F15\u4E86\u4F17\u591A\u201C\u5B88\u62A4\u8005\u201D\u3002\u53EA\u6709\u6781\u5EA6\u8C28\u614E\u6216\u6700\u4E3A\u5F3A\u5927\u7684\u5B58\u5728\u624D\u80FD\u627E\u5230\u901A\u884C\u4E4B\u9053\u2026\u2026 \u2014\u2014\u5165\u4FB5\u8005\uFF0C\u5F53\u5FC3\u3002\n\n\u6CE8\u610F\uFF1A\u6B64\u661F\u7403\u7981\u6B62\u4E3B\u529B\u8230\u8FDB\u5165\u3002"



PlanetType: BarrenMetal
PlayfieldType: Planet
Difficulty: 4

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
#AllowBlueprintBA: False
AllowBlueprintHV: False

AllowCV: False

LandClaimZone: Device


# == Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.6, 0.3, 0.0"

# LightStrength & Shadows
DayLightIntensity: 1.4
NightLightIntensity: 1.5
DayShadowStrength: 0.95
NightShadowStrength: 0.5

# Fog basics
FogCloudIntensity: 0.8
AtmosphereFog: 0
GroundFogIntensity: 0.02
GroundFogHeight: 180

# Atmosphere colours; will effect even weather
SunFlare: EnvironmentalEffects/SunFlareBlue

SkyColor: "0.9, 0.25, 0.0"
SkyHorizonColor: "0.5, 0.1, 0.005"
FogColor: "0.8, 0.40, 0.40"

LightZenithColor: "0.95, 0.95, 0.90"
LightHorizonColor: "0.8, 0.3, 0.1"
NightLightColor: "0.3, 0.4, 0.45"

CloudsZenithColor: "0.4, 0.108, 0.0"
CloudsHorizonColor: "0.4, 0.07, 0.05"
CloudsNightZenithColor: "0.03, 0.010, 0.01"
CloudsNightHorizonColor: "0.03, 0.010, 0.01"

# Wind
WindSpeed: 3

# Clouds. These parameters will only matter if NO weather effect is defined (='default' weather)
CloudsDensity: 0.95
CloudsSharpness: 1
CloudsBrightness: 0.3
CloudsOpacity: 0.5


# Special effects around the player
SpecialEffectsLocal:
  - Name: Grime
    MaxHeight: 20

SpecialEffectsGlobal:
# Weather
  - Name: Clear
    Type: Weather
    InitialDelay: 2
    Delay: 2  
    Lifetime: 600
  - Name: CloudsLight
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1200
  - Name: CloudsMedium
    Type: Weather
    InitialDelay: 6
    Delay: 2
    Lifetime: 1000
  - Name: CloudsDark
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 600
  - Name: FireRain
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 600


# Global Effect
  - Name: MeteorShower
    Time: Day
    InitialDelay: 0
    Delay: 2
    Lifetime: 60
    PlyDist: 200
    SpawnY: 100
    Struct: Avoid


# ==============================================================

### Resource Deposits
RandomResources:

      
### Resource Asteroids
AsteroidResources:

### POIs
POIs:
    Random:
    
    
# =========== Placing the basic POI for the playfield to work ===========

          # DroneBase Xenu - High difficulty POI (outdated, but fond memories of that 'plasma phalanx')
        - GroupName: DroneBaseT3                        #CommandCenter
          IsImportant: True
          Faction: Zirax
          NoShieldReload: True
          IsCommandCenter: True
          DroneBaseSetup: DroneBaseSetup
          BiomesExcluded: [ PoleEdge ] 
          CountMinMax: [ 1, 1 ]
          DroneProb: 1.0
          DronesMinMax: [ 4, 4 ]
          ReserveCount: 20
          TroopTransport: True
          SpawnPOIAvoid: [ START ]
          SpawnPOIAvoidDistance: 2000
          Properties: 
            - Key: Music
              Value: Encryptor
            - Key: RegenAfter
              Value: 720

          # Safe place to respawn after being shot down by turrets
        - GroupName: TS_Metal_Waypoint
          IsImportant: True
          Faction: Polaris
          NoShieldReload: True
          BiomesExcluded: [ PoleEdge ] 
          CountMinMax: [ 1, 1 ]
          DroneProb: 0
          DronesMinMax: [ 1 ]
          ReserveCount: 0
          TroopTransport: False 
          SpawnResource: ["ErestrumResource:1-1"]
          SpawnResourceRange: [100, 250]
          SpawnPOIAvoid: [DroneBaseT3, START]
          SpawnPOIAvoidDistance: 1000
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

