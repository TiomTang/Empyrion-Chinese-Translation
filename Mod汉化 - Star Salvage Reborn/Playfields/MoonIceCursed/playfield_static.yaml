---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "\u4E00\u4E2A\u51B0\u51B7\u7684\u4F34\u661F\uFF0C\u5176\u5730\u58F3\u4E0E\u5CA9\u77F3\u6838\u5FC3\u4E4B\u95F4\u9690\u85CF\u7740\u6DF1\u9083\u7684\u6D77\u6D0B\u3002\u5FAE\u5F31\u7684\u6709\u673A\u7269\u8D28\u5728\u8868\u9762\u7559\u4E0B\u8272\u5F69\u6591\u6593\u7684\u6761\u7EB9\u3002\u2014\u2014\u8FD9\u662F\u5BF9\u592A\u9633\u7CFB\u4E2D\u4E00\u9897\u536B\u661F\u7684\u56DE\u5FC6\u2026\u2026"

PlanetType: MoonIce
PlayfieldType: Moon
Difficulty: 2
# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

LandClaimZone: Device

# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.1, 0, 0" 
SkyColor: "0,0,0"
AtmosphereParams: [10, 3]

# Light
DayLightIntensity: 0.05
NightLightIntensity: 0.05
DayShadowStrength: 0.95

LightZenithColor: "0.01,0.01,0.01"
LightHorizonColor: "0.05,0,0"
NightLightColor: "0.1, 0, 0"

# Sun
SunFlare: EnvironmentalEffects/SunFlareRed
OrbitUsesLightColor: True

# Fog
FogColor: "0, 0, 0"
FogCloudIntensity: 0.8
# AtmosphereFog: 0.95
# GroundFogIntensity: 0.4
# GroundFogHeight: 800

# Clouds and Wind
CloudsDensity: 1
CloudsSharpness: 0
CloudsBrightness: 0
CloudsOpacity: 0.5
CloudsZenithColor: "0.03,0,0"
CloudsHorizonColor: "0.03,0.03,0"
CloudsNightZenithColor: "0, 0, 0.03"
CloudsNightHorizonColor: "0.02, 0.01, 0.02"

WindSpeed: 0


SpecialEffectsGlobal:
  - Name: Clear    # To remove the 'space view clouds'
    Type: Weather
    InitialDelay: 0
    Delay: 0
    Lifetime: 3000

# ==============================================================

### Resource Deposits
RandomResources:

      
### Resource Asteroids
AsteroidResources:

### POIs
POIs:
    Random:
        - GroupName: DroneBaseT1  #CommandCenter
          Faction: Zirax  
          NoShieldReload: True
          IsCommandCenter: True
          DroneBaseSetup: DroneBaseSetup
          CountMinMax: [ 0, 1 ]
          DroneProb: 1.0
          DronesMinMax: [ 4, 5 ]
          ReserveCount: 5
          Properties: 
            - Key: RegenAfter
              Value: 720

# ProgenitorArtifacts
        - GroupName: ProgenitorArtifacts      
          Faction: None     
          CountMinMax: [ 1, 1 ]
          IsScalingCount: True 
          DroneProb: 1.0
          DronesMinMax: [ 1, 2 ]
          ReserveCount: 4
          TroopTransport: False
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

        - GroupName: CrashedShipLargeSnow      
          Faction: None     
          CountMinMax: [ 1, 1 ]
          IsScalingCount: True 
          DroneProb: 1.0
          DronesMinMax: [ 1, 2 ]
          ReserveCount: 4
          TroopTransport: False
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

        - GroupName: RadosAuxT1Snow
