          DroneProb: 0.7
          DronesMinMax: [ 1, 2 ]
          ReserveCount: 2
          TroopTransport: False
          SpawnResource: ["PentaxidResource:1-2"]
          ResourceDistance: 400
          Properties:
            - Key: RegenAfter
              Value: 720
