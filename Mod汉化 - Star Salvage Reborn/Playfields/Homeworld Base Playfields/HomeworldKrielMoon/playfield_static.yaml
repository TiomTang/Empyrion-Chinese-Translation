# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html

Description: "\u8FD9\u9897\u5E74\u8F7B\u7684\u536B\u661F\u65E9\u5DF2\u5728\u6052\u661F\u98CE\u7684\u65E0\u60C5\u5439\u62C2\u4E0B\u5931\u53BB\u4E86\u5927\u6C14\u5C42\u3002\u672A\u88AB\u4FB5\u6270\u7684\u6700\u540E\u4E00\u7247\u5F00\u9614\u7194\u5CA9\u6D77\uFF0C\u6B63\u7ED3\u6676\u6210\u5947\u5F02\u7684\u5F62\u6001\u3002"

PlanetType: KrielHomeworldMoon
Emissive: True
PlayfieldType: Moon
Difficulty: 3

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False


LandClaimZone: Device

# Atmosphere and Sky
AtmosphereEnabled: False

# Light
DayLightIntensity: 0.6
NightLightIntensity: 0.7
DayShadowStrength: 0.95

# Sun
SunFlare: EnvironmentalEffects/SunFlareWhiteMoon

# ==============================================================

### Resource Deposits
RandomResources:

### Resource Asteroids
AsteroidResources:


### POIs
POIs:
    Random:  
        - GroupName: DroneBaseT1     #CommandCenter
          Faction: Kriel 
          NoShieldReload: True 
          IsCommandCenter: True
          DroneBaseSetup: DroneBaseSetup
          CountMinMax: [ 0, 1 ]
          DroneProb: 1.0
          DronesMinMax: [ 4, 5 ] 
          ReserveCount: 5
          Properties: 
            - Key: RegenAfter
              Value: 720

        - GroupName: ProgenitorArtifacts      
          Faction: None     
          CountMinMax: [ 1, 1 ]
          IsScalingCount: True 
          DroneProb: 1.0
          DronesMinMax: [ 1, 2 ]
          ReserveCount: 4
          TroopTransport: False
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

        - GroupName: CrashedShip       
          Faction: None  
          CountMinMax: [ 1, 2 ]
          IsScalingCount: True 
          DroneProb: 1.0
          DronesMinMax: [ 1, 2 ]
          ReserveCount: 4
          TroopTransport: False
          Properties: 
            - Key: MapMarker
              Value: Neutral
            - Key: RegenAfter
              Value: 720

# Kriel
        - GroupName: KrielMain 
          Faction: Kriel    
          NoShieldReload: True
          CountMinMax: [ 0, 1 ]
          Properties: 
            - Key: Music
              Value: AlteredPhase
            - Key: RegenAfter
              Value: 720 

        - GroupName: KrielDefenseT1 
          Faction: Kriel    
          NoShieldReload: True
          CountMinMax: [ 10, 20 ]
          Properties: 
            - Key: Music
              Value: AlteredPhase
            - Key: RegenAfter
              Value: 720 

    FixedPlayerStart:
        - Mode: Debug
          Pos: [ -596, 104, -1063 ]
          RotY: 125

        - Mode: Survival
          Spawn: EscapePod
          Armor: ArmorMedium

