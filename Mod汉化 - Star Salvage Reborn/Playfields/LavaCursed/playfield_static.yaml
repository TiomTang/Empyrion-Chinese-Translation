---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html
Description: "\u6CE8\u610F\uFF1A\u6B64\u661F\u7403\u4E0A\u4E0D\u5141\u8BB8\u4F7F\u7528\u4E3B\u529B\u8230\u3002"
PlanetType: Lava
Emissive: True
PlayfieldType: Planet
Difficulty: 4

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
# AllowBlueprintBA: False
AllowBlueprintHV: False

AllowCV: False

LandClaimZone: Device

Description: "Planets are born by the swirling, scattered ashes - the legacy of dead, exploded stars. 
  \n...Gravity will collect all this messy debris, and give it a new form.
  \n
  \nBut a world's amount of rock and dust, slowly grinding, clumping together... will result in an enormous amount of friction.
  \n
  \nWhich means, [b][i]heat[/i][/b].
  \n
  \nThis place is just a mere quarter billion years old, and struggles to radiate all this excess heat into space -
  \nThe bigger the planet, the longer it takes.
  \n
  \nIn this liquid state, the planet resembles more a giant cooking pot, or lava lamp, or a blast furnance:
  \nContinents of less dense slag skim the surface, while the heavy, exotic metals sink into in planet's deep inner.
  \n
  \nYet, by thermal churning and stirring, some bits of that precious core will be again swept back out, in reach of the surface.
  \n
  \nFor those who brave these temperatures, there will be great rewards. "




# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.1, 0, 0" 
SkyColor: "0,0,0"
AtmosphereParams: [10, 3]

# Light
DayLightIntensity: 0.05
NightLightIntensity: 0.05
DayShadowStrength: 0.95

LightZenithColor: "0.01,0.01,0.01"
LightHorizonColor: "0.05,0,0"
NightLightColor: "0.1, 0, 0"

# Sun
SunFlare: EnvironmentalEffects/SunFlareRed
OrbitUsesLightColor: True

# Fog
FogColor: "0, 0, 0"
FogCloudIntensity: 0.8
# AtmosphereFog: 0.95
# GroundFogIntensity: 0.4
# GroundFogHeight: 800

# Clouds and Wind
CloudsDensity: 1
CloudsSharpness: 0
CloudsBrightness: 0
CloudsOpacity: 0.5
CloudsZenithColor: "0.03,0,0"
CloudsHorizonColor: "0.03,0.03,0"
CloudsNightZenithColor: "0, 0, 0.03"
CloudsNightHorizonColor: "0.02, 0.01, 0.02"
WindSpeed: 30


# Special effects around the player
SpecialEffectsLocal:
  - Name: Grime
    MaxHeight: 20

SpecialEffectsGlobal:
# Weather

 # Do not use the weathers CloudsLight, CloudsMedium, Wind, ColdWave here! (Their clouds react extremely to colouring)
 # weather Clear >>  Already in HeatWave


  - Name: Clouds
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1500
  - Name: CloudsDark
    Type: Weather
    InitialDelay: 0
    Delay: 2  
    Lifetime: 1200
  - Name: Fog
    Type: Weather
    InitialDelay: 48
    Delay: 12
    Lifetime: 1000
  - Name: HeatWave
    Type: Weather
    InitialDelay: 12
    Delay: 12
    Lifetime: 1200
  - Name: MeteorFireRain
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 300
  - Name: FireRain
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 300

# Global Effect
  - Name: MeteorShower
    Time: Day
    InitialDelay: 1
    Delay: 5
    Lifetime: 60
    PlyDist: 200
    SpawnY: 100
    Struct: Avoid

  - Name: ThunderAndLightningPurple
    Time: Night
    InitialDelay: 1.5   
    Delay: 4
    Lifetime: 300     
    PlyDist: 100
    SpawnY: 500
    Struct: Avoid    
