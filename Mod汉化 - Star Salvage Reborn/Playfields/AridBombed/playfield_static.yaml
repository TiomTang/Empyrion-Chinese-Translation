---
# Playfield Configuration
# IMPORTANT: YAML files use spaces as indentation. Please don't use TABs - tab indentation is forbidden: http://yaml.org/faq.html
Description: "\u6CE8\u610F\uFF1A\u6B64\u661F\u7403\u4E0A\u4E0D\u5141\u8BB8\u62E5\u6709\u4E3B\u529B\u8230\u3002"
PlanetType: Arid
PlayfieldType: Planet
Difficulty: 2

# Blueprint factory is disabled on this starting planet.
AllowBlueprintSV: False
AllowBlueprintCV: False
#AllowBlueprintBA: False
AllowBlueprintHV: False

LandClaimZone: Device

AllowCV: False

# Atmosphere and Sky
AtmosphereEnabled: True
AtmosphereColor: "0.1, 0, 0" 
SkyColor: "0,0,0"
AtmosphereParams: [10, 3]

# Light
DayLightIntensity: 0.05
NightLightIntensity: 0.05
DayShadowStrength: 0.95

LightZenithColor: "0.01,0.01,0.01"
LightHorizonColor: "0.05,0,0"
NightLightColor: "0.1, 0, 0"

# Sun
SunFlare: EnvironmentalEffects/SunFlareRed
OrbitUsesLightColor: True

# Fog
FogColor: "0, 0, 0"
FogCloudIntensity: 0.8
# AtmosphereFog: 0.95
# GroundFogIntensity: 0.4
# GroundFogHeight: 800

# Clouds and Wind
CloudsDensity: 1
CloudsSharpness: 0
CloudsBrightness: 0
CloudsOpacity: 0.5
CloudsZenithColor: "0.03,0,0"
CloudsHorizonColor: "0.03,0.03,0"
CloudsNightZenithColor: "0, 0, 0.03"
CloudsNightHorizonColor: "0.02, 0.01, 0.02"
WindSpeed: 4

# Special Effects
SpecialEffectsLocal:
  - Name: Pollen
    Biome: [ Desert, Dunes, Rocks ]  
    Time: Day
    MaxHeight: 10
  - Name: DustDevil
    Biome: [ Desert, Dunes, Rocks ]  
    Time: Day
    FollowPlayerY: True
    MaxHeight: 10
  - Name: FireFliesGreenFew
    Biome: [ Marsh, Oasis, OasisEdge, OasisThin, Grassland ]
    Time: Night
    MaxHeight: 15
  - Name: DandelionsFew
    Biome: [ Savanna, SavannaEdge ]
    Time: Day
    MaxHeight: 10
  - Name: ButterfliesBlue
    Biome: [ Marsh, Oasis, OasisEdge, OasisThin, Grassland ]
    Time: Day
    MaxHeight: 15
  - Name: TarantulaHawksFew
    Biome: [ Marsh, Savanna, SavannaEdge ]
    Time: Day
    MaxHeight: 15
  - Name: WindLines
    Biome: [ Desert, Dunes, Rocks, LowMountains, Mountains ]
    Time: Day
    MaxHeight: 10

SpecialEffectsGlobal:
# Weather
  - Name: Clear
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1200
  - Name: CloudsLight
    Type: Weather
    InitialDelay: 0
    Delay: 2
    Lifetime: 1200
  - Name: CloudsMedium
    Type: Weather
    InitialDelay: 0
    Delay: 3
    Lifetime: 1200
  - Name: Clouds
    Type: Weather
    InitialDelay: 12
    Delay: 10
    Lifetime: 1000
  - Name: Wind
    Type: Weather
    InitialDelay: 24
    Delay: 10
    Lifetime: 600
  - Name: Fog
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 1000
  - Name: HeatWave
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 1200
  - Name: FogRadiationGreen
    Type: Weather
    InitialDelay: 48
    Delay: 24
    Lifetime: 600
# Global Effect
  - Name: BirdFlocksVultures
    Biome: [ Any ]
    Time: Day
    InitialDelay: 2
    Delay: 4
    Lifetime: 600
    PlyDist: 50
    SpawnY: 40
    Struct: True
  - Name: MeteorShower
    Biome: [ Savanna, SavannaEdge, Dunes, Desert ]
    Time: Always
    InitialDelay: 3.5
    Delay: 5
    Lifetime: 60
    PlyDist: 200
    SpawnY: 100
    Struct: Avoid

