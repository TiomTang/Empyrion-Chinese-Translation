Gravity: 0
AtmosphereEnabled: False
PvPProb: 0
UseFixed: True

Radiation: [20000,50000]
TemperatureDay: [1000,2000]
# Dark Ambient Music
Music: [alien2, AnAridPlace, barren, Blight, Cypher, DarkSoundscape, DarkSoundscape2, DarkSoundscape3, lava2]

PlayfieldType: Space
LandClaimZone: Device
PlanetType: Relativistic Jet
PlayfieldLevelOverride: [1,2]

DenyMicroWarp: true

### Resource Asteroids
Resources:
